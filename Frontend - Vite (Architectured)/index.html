<!doctype html>
<html lang="id" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Content Security Policy (CSP) -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://s3.tradingview.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://*.tradingview.com; connect-src 'self' http://localhost:* ws://localhost:* https://s3.tradingview.com; frame-src 'self' https://s3.tradingview.com; font-src 'self' data: https://fonts.gstatic.com; frame-ancestors 'none';">
    
    <!-- Anti-Clickjacking / Frame-Busting Fallback -->
    <style id="antiClickjack">body{display:none !important;}</style>
    <script type="text/javascript">
      if (self === top) {
        var antiClickjack = document.getElementById("antiClickjack");
        if (antiClickjack) antiClickjack.parentNode.removeChild(antiClickjack);
      } else {
        top.location = self.location;
      }
    </script>

         simbol/timeframe berganti — preconnect biar TLS handshake-nya sudah
         siap sebelum widget benar-benar di-mount. -->
    <link rel="preconnect" href="https://s3.tradingview.com" crossorigin />
    <link rel="dns-prefetch" href="https://s3.tradingview.com" />
    <title>Betrix — Client</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
